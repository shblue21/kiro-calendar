name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require successful CI on this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Release from main."
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --branch main --event push --status success \
            --limit 1 --json headSha --jq 'length')
          if [ "$passed" != 1 ]; then
            echo "::error::This source commit must pass CI before release."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build runtime package
        run: |
          npm ci --ignore-scripts
          npm --prefix ui ci --ignore-scripts
          npm run package

      - name: Verify packaged Universal helper
        run: |
          xcrun lipo ".build/crew-calendar/native/Crew Calendar Bridge.app/Contents/MacOS/CrewCalendarBridge" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures ".build/crew-calendar/native/Crew Calendar Bridge.app"

      - name: Create deployment commit and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/prepare-release.mjs

      - name: Publish branch and tag together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          gh auth setup-git
          # Empty leases require both remote refs to be absent, even if another
          # publisher creates one after the preparation check.
          git push --atomic \
            --force-with-lease="refs/heads/$RELEASE_BRANCH:" \
            --force-with-lease="refs/tags/$RELEASE_TAG:" \
            origin "refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"
          {
            echo "Source commit: $GITHUB_SHA"
            echo ""
            echo "Deployment commit: $RELEASE_COMMIT"
            echo ""
            echo "Branch: $RELEASE_BRANCH"
            echo ""
            echo "Tag: $RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
