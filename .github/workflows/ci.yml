name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix ui ci --ignore-scripts
          python -m pip install -r .github/requirements-ci.txt

      - name: Verify API test dependency
        run: python -c "import aiohttp"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Python lint
        run: ruff check backend tests

      - name: Tests
        run: npm test

      - name: UI typecheck and build
        run: npm run build

      # This command also checks Swift formatting, so it runs on macOS.
      - name: Formatting
        if: runner.os == 'macOS'
        run: npm run format:check

      - name: Build native helper
        if: runner.os == 'macOS'
        run: npm run build:native

      - name: Package
        run: node scripts/package.mjs

      - name: Verify Universal package
        if: runner.os == 'macOS'
        run: |
          xcrun lipo ".build/crew-calendar/native/Crew Calendar Bridge.app/Contents/MacOS/CrewCalendarBridge" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures ".build/crew-calendar/native/Crew Calendar Bridge.app"

      # Tar preserves the helper's executable permissions when the artifact is downloaded.
      - name: Archive macOS package
        if: matrix.os == 'macos-15'
        run: tar -C .build -czf .build/crew-calendar-macos.tar.gz crew-calendar

      - name: Upload macOS package
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crew-calendar-macos-universal
          path: .build/crew-calendar-macos.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
